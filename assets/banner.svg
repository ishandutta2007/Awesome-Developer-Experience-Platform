<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes waveGlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .bg-grid { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .node-pulse { animation: pulse 4s ease-in-out infinite; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .dash-line { stroke-dasharray: 8, 8; animation: dashFlow 3s linear infinite; }
    
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16"/>

  <!-- Background Grid -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Dynamic / Animated Background Orbs -->
  <circle cx="150" cy="100" r="140" fill="url(#glowGrad)" class="node-pulse" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="160" fill="url(#glowGrad)" class="node-pulse" filter="url(#glow)"/>

  <!-- Animated Data Flow Lines in Background -->
  <path d="M 50 330 Q 300 370 600 330 T 1150 340" fill="none" stroke="url(#cyanPurpleGrad)" stroke-width="2" class="dash-line" opacity="0.5"/>
  <path d="M 100 60 Q 400 20 800 60 T 1100 50" fill="none" stroke="#3b82f6" stroke-width="1.5" class="dash-line" opacity="0.4"/>

  <!-- Floating Tech Particles -->
  <circle cx="220" cy="80" r="4" fill="#06b6d4" class="particle-1"/>
  <circle cx="980" cy="120" r="6" fill="#ec4899" class="particle-2"/>
  <circle cx="850" cy="310" r="5" fill="#8b5cf6" class="particle-3"/>

  <!-- Top Accent Border Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#cyanPurpleGrad)"/>

  <!-- Foreground Content Box with High-Contrast Background Backplate -->
  <g filter="url(#dropShadow)">
    <!-- Central Card Backdrop for Foreground Visibility -->
    <rect x="120" y="70" width="960" height="260" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Decorative Top Badge Pill -->
    <g transform="translate(160, 100)">
      <rect width="210" height="30" rx="15" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
      <text x="15" y="20" class="pill-text" fill="#c084fc">⚡ DEVELOPER EXPERIENCE</text>
    </g>

    <!-- Main Foreground Title & Subtitle -->
    <text x="160" y="175" class="title-text">Awesome Developer Experience Platform</text>
    <text x="160" y="215" class="subtitle-text">Curated SaaS Platforms, Open-Source IDPs &amp; DevEx Analytics Ecosystem</text>

    <!-- Interactive / Feature Pills in Foreground -->
    <g transform="translate(160, 250)">
      <!-- Pill 1: DORA & SPACE -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="22" class="pill-text">📊 DORA &amp; SPACE Metrics</text>
      </g>
      <!-- Pill 2: IDPs & Service Catalogs -->
      <g transform="translate(180, 0)">
        <rect width="210" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="22" class="pill-text">🛠️ Developer Portals (IDP)</text>
      </g>
      <!-- Pill 3: Developer Surveys -->
      <g transform="translate(405, 0)">
        <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="22" class="pill-text">💬 Qualitative Surveys</text>
      </g>
      <!-- Pill 4: Open-Source -->
      <g transform="translate(605, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="22" class="pill-text">🌟 Open-Source Tools</text>
      </g>
    </g>
  </g>
</svg>
